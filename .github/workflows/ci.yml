name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs and GLib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make check
      - run: make test
      - run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: window-merge@berk-karaal
          path: window-merge@berk-karaal.zip

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: window-merge@berk-karaal
      - uses: softprops/action-gh-release@v2
        with:
          files: window-merge@berk-karaal.zip
          generate_release_notes: true
