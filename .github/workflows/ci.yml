name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gjs and GLib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v3
      - run: pip install shexli
      - run: just check
      - run: just test
      - run: just lint
